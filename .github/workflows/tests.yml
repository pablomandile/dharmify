name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Los tests corren en sqlite en memoria (ver phpunit.xml), pero
    # `composer setup` hace `artisan migrate` contra el .env, que sale de
    # .env.example y apunta a MySQL. Sin este servicio, el setup corta con
    # "Connection refused" y el job muere antes de correr un solo chequeo.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: dharmify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # 8.4 y no 8.3: los paquetes de Symfony del composer.lock exigen
          # php >=8.4.1, así que con 8.3 el `composer install` ni arranca.
          # Si algún día sube el requisito, este número tiene que subir con él.
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
